<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gabriel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>App Le Gabriel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Raleway:wght@600;700;800&display=swap">
<style>
/* Layout : panneau de présentation sombre à gauche + téléphone au centre (desktop) ; app plein écran sur mobile. Identité reprise de la maquette. */
:root{
  color-scheme: light;
  --night:#0E0E0D; --ink:#151412; --paper:#F5F3EE; --card:#FFFFFF; --stage:#E6E1D6;
  --line:#E4DFD4; --line-soft:#EEEAE1; --field:#D9D3C6; --dash:#B5AE9F;
  --muted:#5E5A52; --muted2:#6B665D; --body2:#3F3C35;
  --gold:#C9A45C; --gold-deep:#B8924A; --gold-text:#7F6128;
  --on-dark:#FFFFFF; --on-dark-muted:#CFC9BD; --on-dark-soft:#B5AFA3; --dark-line:#3A3730; --dark-2:#2A2823;
  --ok:#22603B; --ok-bg:#E6F0E8; --ok-dot:#2F7A4B;
  --warn:#7A4B0C; --warn-bg:#F6ECDC; --warn-dot:#B7791F;
  --bad:#8A3226; --bad-bg:#F6E3DF; --danger:#9A3B2E;
  --display: Raleway, "Avenir Next", "Segoe UI", sans-serif;
  --text: Barlow, "Helvetica Neue", system-ui, sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--text);font-size:16px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
.ic{flex-shrink:0;display:block}
#root{height:100%}

/* ---------- Vue d'ensemble ---------- */
.ov{min-height:100%;display:grid;grid-template-columns:430px minmax(0,1fr);background:var(--paper)}
.ov-left{background:var(--night);color:var(--on-dark);padding:44px 40px 40px;display:flex;flex-direction:column;gap:28px}
.ov-left img{width:132px;height:132px;object-fit:cover;margin-left:-12px}
.ov-left h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.12}
.ov-left p{font-size:17px;line-height:1.5;color:var(--on-dark-muted)}
.label-gold{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.role-links{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.role-link{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--dark-line);border-radius:12px;color:var(--on-dark);width:100%;transition:border-color .15s,background .15s}
.role-link:hover{border-color:var(--gold);background:#17160f}
.role-link .ic-gold{color:var(--gold)}
.role-link .stack{flex:1}
.role-link .t{font-size:18px;font-weight:600}
.role-link .s{font-size:14px;color:var(--on-dark-soft)}
.role-link .chev{color:var(--on-dark-soft)}
.ov-right{padding:48px 48px 40px;display:flex;flex-direction:column;gap:28px;min-width:0}
.ov-right .label-gold{color:var(--gold-text)}
.ov-right h2{font-family:var(--display);font-weight:700;font-size:32px}
.ov-right p.lead{font-size:17px;color:var(--muted);line-height:1.5;max-width:620px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
thead tr{background:#F0EDE6}
th,td{text-align:left;padding:12px 14px;vertical-align:top}
thead th{font-weight:600;font-size:14px}
thead th:first-child{color:var(--muted)}
tbody tr{border-top:1px solid var(--line)}
tbody th{font-weight:600}
td.none{color:var(--muted2)}
.howto{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:760px}
.howto .ic{color:var(--gold-text);margin-top:2px}
.howto p{font-size:15px;line-height:1.5;color:var(--body2)}
.howto strong{color:var(--ink)}
.ov-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Démo par rôle ---------- */
.split{height:100%;display:grid;grid-template-columns:360px minmax(0,1fr)}
.panel{background:var(--night);color:var(--on-dark);padding:28px 26px;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.panel-top{display:flex;align-items:center;gap:12px}
.panel-top img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.panel-top .t{font-family:var(--display);font-weight:700;font-size:18px}
.panel-top .s{font-size:14px;color:var(--on-dark-muted)}
.panel .role-link{padding:12px 14px;position:relative}
.panel .role-link .t{font-size:16px}
.panel .role-link .s{font-size:13px}
.panel .role-link[aria-current="true"]{border-color:var(--gold);background:#1c1a15}
.ping{width:9px;height:9px;border-radius:999px;background:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.25)}
.panel-sec{display:flex;flex-direction:column;gap:10px}
.sees{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.sees li{display:flex;gap:10px;font-size:14px;line-height:1.4;color:var(--on-dark-muted)}
.sees li .ic{color:var(--gold);margin-top:1px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--dark-line);color:var(--on-dark)}
.step:hover{border-color:var(--gold)}
.step .n{width:24px;height:24px;border-radius:999px;border:1.5px solid var(--dark-line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--on-dark-muted);flex-shrink:0}
.step.done .n{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.step .stack{flex:1}
.step .t{font-size:14px;font-weight:600}
.step .s{font-size:12px;color:var(--on-dark-soft)}
.step.done .t{color:var(--on-dark-muted)}
.panel-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.pbtn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--dark-line);color:var(--on-dark);font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.pbtn:hover{border-color:var(--gold)}
.pbtn.warn{border-color:var(--danger);color:#F2C6BE}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto;min-width:0}
.stage-cap{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phone{width:390px;height:860px;max-height:calc(100% - 34px);min-height:560px;border:10px solid var(--night);border-radius:48px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(14,14,13,.45),0 0 0 1px #2a2823;background:var(--paper);flex-shrink:0}
.mbar{display:none;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#000;color:var(--on-dark-muted);font-size:13px}
.mbar button{color:var(--gold);font-weight:600;min-height:32px}

/* ---------- App (dans le téléphone) ---------- */
.app{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.hdr{background:var(--night);padding:22px 20px;display:flex;flex-direction:column;gap:18px;color:var(--on-dark)}
.hdr.sub{padding:16px 12px 22px;gap:10px}
.hdr.plain{padding:26px 20px 22px;gap:4px}
.hdr-top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;color:var(--gold);min-height:44px}
.brand span{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:15px}
.hdr-actions{display:flex;align-items:center;gap:10px}
.apt{font-size:14px;font-weight:600;border:1px solid var(--dark-line);border-radius:999px;padding:6px 12px}
.bell{width:44px;height:44px;border-radius:999px;border:1px solid var(--dark-line);display:flex;align-items:center;justify-content:center;position:relative;color:var(--on-dark)}
.bdot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:999px;background:var(--gold)}
.rbadge{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--dark-line);border-radius:999px;padding:6px 12px}
.rbadge.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.eyebrow{font-size:14px;color:var(--gold);font-weight:600}
.hdr h1{font-family:var(--display);font-weight:700;font-size:26px;color:var(--on-dark)}
.hdr h1.big{font-size:28px}
.hdr .lead{font-size:15px;color:var(--on-dark-muted);line-height:1.4}
.hdr .inner{padding:0 8px;display:flex;flex-direction:column;gap:4px}
.back{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--gold);font-size:15px;font-weight:600;align-self:flex-start}
.body{flex:1;padding:20px;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h2{font-size:17px;font-weight:600}
.h2.sm{font-size:16px}
.link{font-size:15px;font-weight:600;color:var(--gold-text);min-height:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.card.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.card.strong{border:2px solid var(--ink)}
.list>*+*{background-image:linear-gradient(var(--line-soft),var(--line-soft));background-size:calc(100% - 32px) 1px;background-position:center top;background-repeat:no-repeat}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;color:var(--ink)}
button.row:hover,button.cardbtn:hover{background-color:#FBFAF7}
.stack{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.t{font-size:16px;font-weight:600}
.t.lg{font-size:18px}
.s{font-size:14px;color:var(--muted);line-height:1.35}
.xs{font-size:13px;color:var(--muted);line-height:1.4}
.appt{width:52px;flex-shrink:0;font-family:var(--display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.pill.sm{font-size:13px;padding:4px 9px}
.pill .dot{width:7px;height:7px;border-radius:999px;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.ok .dot{background:var(--ok-dot)}
.pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.warn .dot{background:var(--warn-dot)}
.pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.bad .dot{background:var(--danger)}
.pill.danger{color:#fff;background:var(--danger)}
.pill.dark{color:#fff;background:var(--ink)}
.pill.gold{color:var(--ink);background:var(--gold)}
.pill.outline{color:var(--ink);border:1px solid #CFC8BA;padding:4px 9px}
.pill.outline.sm{padding:3px 9px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--ink);color:#fff;width:100%}
.banner .s{color:var(--on-dark-muted)}
.circ{width:44px;height:44px;flex-shrink:0;border-radius:999px;background:var(--dark-2);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.cardbtn{display:flex;flex-direction:column;gap:14px;padding:16px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink)}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.center{align-items:center}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bars span{height:5px;border-radius:3px;background:var(--line)}
.bars span.on{background:var(--gold-deep)}
.meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.meta.ok{color:var(--ok);font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--field);background:var(--card);font-size:15px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.switch{width:52px;height:32px;flex-shrink:0;border-radius:999px;padding:3px;display:flex;justify-content:flex-start;background:var(--field);transition:background .2s}
.switch span{width:26px;height:26px;border-radius:999px;background:#fff;display:block;transition:background .2s}
.switch[aria-checked="true"]{background:var(--ink);justify-content:flex-end}
.switch[aria-checked="true"] span{background:var(--gold)}
.switch.live{background:var(--danger)}
.switch.live[aria-checked="true"]{background:var(--ok-dot)}
.switch.live span,.switch.live[aria-checked="true"] span{background:#fff}
.btn{min-height:54px;width:100%;border-radius:12px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn:hover{background:#2a2823}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);font-size:16px;min-height:50px}
.btn.ghost:hover{background:#fff}
.btn.md{min-height:50px;font-size:16px}
.btn.sm{min-height:44px;width:auto;font-size:15px;border-radius:10px;padding:0 14px}
.btn.sm.ghost{min-height:44px}
.btn.on-dark{background:transparent;border:1px solid var(--dark-line);color:#fff}
.btn.danger{background:var(--danger)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label,.lbl{font-size:16px;font-weight:600}
input[type=text],select,textarea{font-family:var(--text);font-size:16px;padding:12px 14px;border:1px solid var(--field);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-height:48px}
textarea{resize:none;line-height:1.4}
input.big{font-family:var(--display);font-weight:700;font-size:20px}
.dashbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px dashed var(--dash);border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.dashbtn:hover{background:#fff}
.photo{position:relative;border-radius:10px;overflow:hidden;background:var(--line-soft)}
.photo img{display:block;width:100%;max-height:180px;object-fit:cover}
.photo .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:999px;background:rgba(14,14,13,.7);color:#fff;display:flex;align-items:center;justify-content:center}
.ph{height:110px;border-radius:10px;background:var(--line-soft);border:1px dashed var(--dash);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted)}
.okbox{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border:1px solid var(--ink);border-radius:12px;font-size:15px;font-weight:600;line-height:1.35}
.dark{background:var(--ink);color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.dark .s,.dark p{color:var(--on-dark-muted);font-size:15px;line-height:1.5}
.dark .gold{color:var(--gold)}
.info{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;background:var(--line-soft);font-size:14px;color:var(--body2);line-height:1.4}
.soft{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500}
.soft.warn{background:var(--warn-bg);color:#6A410A}
.soft.bad{background:var(--bad-bg);color:var(--bad)}
.soft.plain{background:var(--paper);color:var(--body2);font-size:15px;padding:12px 14px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);background:var(--card)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.day .dw{font-size:12px;font-weight:500}
.day .dn{font-size:17px;font-weight:600}
.day .dd{width:6px;height:6px;border-radius:999px;background:transparent}
.day .dd.busy{background:var(--warn-dot)}
.day .dd.mine{background:var(--gold)}
.slot{min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 14px;border:1px solid var(--line);background:var(--card)}
.slot .t{font-size:16px}
.slot .xs{color:inherit}
.slot[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slot:disabled{background:var(--line-soft);color:var(--muted2);text-decoration:line-through;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:124px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:var(--ink)}
.tile:hover{border-color:#CFC8BA}
.count{min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--gold);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat b{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat.hot{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.hot b{color:var(--gold)} .stat.hot span{color:#fff}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:9px 13px}
.radio{width:20px;height:20px;flex-shrink:0;border-radius:999px;border:2px solid var(--dash)}
.opt[aria-pressed="true"] .radio{border:6px solid var(--ink)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .mk{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #CFC8BA;background:#fff;color:#fff}
.tl .mk.done{background:var(--ink);border-color:var(--ink)}
.tl .mk.cur{border:7px solid var(--gold-deep)}
.tl .ln{width:2px;flex-grow:1;background:var(--line);min-height:22px}
.tl .ln.done{background:var(--ink)}
.tl .tx{padding-bottom:16px;display:flex;flex-direction:column;gap:2px}
.tl .tx .t.todo{color:var(--muted)}
.tl .tx .s.cur{color:var(--gold-text);font-weight:600}
.tsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tsteps div{display:flex;flex-direction:column;gap:6px}
.tsteps .b{height:6px;border-radius:3px;background:var(--line)}
.tsteps .b.done{background:var(--ink)} .tsteps .b.cur{background:var(--gold-deep)}
.tsteps .l{font-size:13px;font-weight:500;color:var(--muted2)}
.tsteps .l.done{color:var(--ink)} .tsteps .l.cur{color:var(--ink);font-weight:700}
.mission{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.mission.hot{background:var(--ink);color:#fff;border-color:var(--ink)}
.mission .when{font-size:14px;font-weight:600;color:var(--gold-text)}
.mission.hot .when{color:var(--gold)}
.mission .big{font-family:var(--display);font-size:26px;font-weight:700}
.mission .ttl{font-size:18px;font-weight:600}
.mission.hot .meta{color:var(--on-dark-muted)}
.quote{font-size:16px;line-height:1.45}

  return '<header class="hdr"><div class="hdr-top"><button type="button" class="brand" data-go="overview" aria-label="Retour à la vue d’ensemble">' + ic('building', 24, 1.6) + '<span>GABRIEL</span></button>' + badge + '</div><div style="display:flex;flex-direction:column;gap:4px">' + (eyebrow ? '<div class="eyebrow">' + eyebrow + '</div>' : '') + '<h1 class="big">' + title + '</h1></div></header>';
}
function photoBox(r, label) {
  if (r.photo) return '<div class="photo"><img src="' + r.photo + '" alt="Photo jointe par le résident"></div>';
  if (r.hasPhoto) return '<div class="ph">' + ic('camera', 20, 1.7) + esc(label || 'Photo jointe par le résident') + '</div>';
  return '';
}
function accessLine(r, strong) {
  if (r.access) return '<div class="meta' + (strong ? ' ok' : '') + '">' + ic(strong ? 'check' : 'lock', 18, 2) + 'Accès autorisé en l’absence du résident</div>';
  return '<div class="meta">' + ic('person', 18, 1.8) + 'Présence du résident requise</div>';
}
function gPill(r) {
  switch (r.status) {
    case 'nouvelle': return pill('sm ' + (r.urgent ? 'danger' : 'warn'), 'Nouvelle');
    case 'assignee': return pill('sm outline', 'Planifiée');
    case 'enroute': return pill('sm dark', 'En route');
    case 'surplace': return pill('sm dark', 'Sur place');
    default: return pill('sm ok', 'Terminée');
  }
}
function gSub(r) {
  var p = r.pro ? PROS[r.pro].name : '';
  switch (r.status) {
    case 'nouvelle': return rel(r.created) + (r.urgent ? ' · urgent' : '');
    case 'assignee': return p + ' · ' + slotText(r.slot);
    case 'enroute': return p + ' · arrivée ' + (r.eta || '');
    case 'surplace': return p + ' · sur place depuis ' + r.log.surplace;
    default: return p + ' · terminée à ' + (r.log.terminee || '');
  }
}
function resPill(r) {
  switch (r.status) {
    case 'nouvelle': return pill('outline sm', 'Envoyée');
    case 'assignee': return pill('outline sm', 'Planifiée');
    case 'enroute': return pill('dark', 'En route');
    case 'surplace': return pill('dark', 'Sur place');
    default: return pill('ok sm', 'Terminée');
  }
}
function resSub(r) {
  switch (r.status) {
    case 'nouvelle': return 'Envoyée · en attente de prise en charge';
    case 'assignee': return 'Technicien assigné · ' + slotText(r.slot);
    case 'enroute': return 'Arrivée prévue vers ' + r.eta;
    case 'surplace': return 'Le technicien est sur place';
    default: return r.doneLabel || ('Terminée aujourd’hui à ' + r.log.terminee);
  }
}
var BARS = { nouvelle: 1, assignee: 2, enroute: 3, surplace: 3, terminee: 4 };
function bars(r) { var n = BARS[r.status], h = ''; for (var i = 0; i < 4; i++) h += '<span class="' + (i < n ? 'on' : '') + '"></span>'; return '<div class="bars" aria-label="Étape ' + n + ' sur 4">' + h + '</div>'; }
function poolRow(big) {
  var o = S.spaces.pool;
  return { sub: o ? 'Ouverte de 7 h à minuit' : 'Fermée temporairement par la gestion', pill: o ? pill('ok', 'Ouverte', 1) : pill('bad', 'Fermée', 1) };
}
function gymRow() { var o = S.spaces.gym; return { sub: o ? 'Ouverte de 7 h à 22 h' : 'Fermée temporairement par la gestion', pill: o ? pill('ok', 'Ouverte', 1) : pill('bad', 'Fermée', 1) }; }
function loungeOn(day) { return S.lounge.filter(function (l) { return l.day === day && l.status === 'ok'; }); }

/* ================= Écrans · Résident ================= */
function resTabsHdr() {
  var unread = S.notifs.some(function (n) { return !n.read; });
  return '<header class="hdr"><div class="hdr-top"><button type="button" class="brand" data-go="overview" aria-label="Retour à la vue d’ensemble">' + ic('building', 24, 1.6) + '<span>GABRIEL</span></button><div class="hdr-actions"><span class="apt">Appt 908</span><button type="button" class="bell" data-act="openNotifs" aria-label="Notifications' + (unread ? ', nouvelles' : '') + '">' + ic('bell', 20, 1.7) + (unread ? '<span class="bdot"></span>' : '') + '</button></div></div><div style="display:flex;flex-direction:column;gap:4px"><div class="eyebrow">Mercredi 30 septembre</div><h1 class="big">Bonjour Victorien</h1></div></header>';
}

var R = {};
R['resident.accueil'] = function () {
  var waiting = S.parcels.filter(function (p) { return p.appt === '908' && !p.given; });
  var act = activeMine()[0];
  var pr = poolRow(), gr = gymRow(), lt = loungeOn(0)[0];
  var h = resTabsHdr() + '<main class="body">';
  if (waiting.length) {
    var last = waiting[waiting.length - 1];
    h += '<button type="button" class="banner" data-go="resident.colis"><span class="circ">' + ic('box', 22, 1.7) + '</span><span class="stack"><span class="t">' + (waiting.length === 1 ? '1 colis vous attend' : waiting.length + ' colis vous attendent') + ' à l’accueil</span><span class="s">Arrivé ' + (last.time ? 'à ' + last.time : last.when) + ' · ' + esc(last.carrier) + '</span></span>' + ic('chevR', 18) + '</button>';
  }
  h += '<section class="sec"><div class="sec-head"><h2 class="h2">En ce moment dans l’immeuble</h2><button type="button" class="link" data-go="resident.espaces">Tout voir</button></div><div class="card list">' +
    '<div class="row">' + ic('pool', 22, 1.6) + '<div class="stack"><span class="t">Piscine</span><span class="s">' + pr.sub + '</span></div>' + pr.pill + '</div>' +
    '<div class="row">' + ic('lounge', 22, 1.6) + '<div class="stack"><span class="t">Lounge</span><span class="s">' + (lt ? 'Privatisé ce soir ' + lt.range : 'Libre ce soir · sur réservation') + '</span></div>' + (lt ? pill('warn', 'Réservé', 1) : pill('ok', 'Libre', 1)) + '</div>' +
    '<div class="row">' + ic('gym', 22, 1.6) + '<div class="stack"><span class="t">Salle d’entraînement</span><span class="s">' + gr.sub + '</span></div>' + gr.pill + '</div>' +
    '</div></section>';
  h += '<section class="sec"><h2 class="h2">Ma demande en cours</h2>';
  if (act) {
    h += '<button type="button" class="cardbtn" data-go="resident.suivi.' + act.id + '"><div class="between"><div class="stack"><span class="t lg">' + esc(act.title) + '</span><span class="s">' + resSub(act) + '</span></div>' + resPill(act) + '</div>' + bars(act) +
      '<div class="meta">' + ic(act.access ? 'check' : 'person', 16, 1.8) + (act.access ? 'Accès autorisé en votre absence' : 'Votre présence est requise') + '</div></button>';
    if (activeMine().length > 1) h += '<button type="button" class="link" style="align-self:flex-start" data-go="resident.suivi">+ ' + (activeMine().length - 1) + ' autre demande en cours</button>';
  } else {
    h += '<div class="card empty"><span class="t">Aucune demande en cours</span><span class="s">Un souci dans l’appartement ? Signalez-le en quelques secondes.</span><button type="button" class="btn sm" data-go="resident.signaler">Signaler un souci</button></div>';
  }
  h += '</section>';
  var anns = S.announcements.filter(seesAnn).slice(0, 3);
  h += '<section class="sec"><h2 class="h2">Annonces</h2><div class="card list">' + anns.map(function (a) {
    return '<div style="padding:14px 16px;display:flex;flex-direction:column;gap:3px"><span class="xs" style="color:var(--gold-text);font-weight:600">Gestion · ' + esc(a.when) + '</span><span class="t">' + esc(a.title) + '</span><span class="s">' + esc(a.body) + '</span></div>';
  }).join('') + '</div></section></main>';
  return h;
};

R['resident.signaler'] = function () {
  var h = subHdr('Accueil', 'resident.accueil', 'Signaler un souci', 'La gestion et le technicien sont prévenus directement.');

  }

    CATS.map(function (c) { return chip(ui.cat === c.id, 'pickCat', c.id, c.label); }).join('') + '</div></section>' +
    '<section class="fld"><label for="desc">Décrivez le problème</label><textarea id="desc" rows="3" data-draft="desc" placeholder="Ex. : le robinet de la cuisine fuit.">' + esc(ui.desc) + '</textarea>' +
    (ui.photo ? '<div class="photo"><img src="' + ui.photo + '" alt="Photo ajoutée"><button type="button" class="x" data-act="removePhoto" aria-label="Retirer la photo">' + ic('x', 18, 2) + '</button></div>'

    '</section><section class="card list">' +
    '<div class="row"><div class="stack"><span class="t">Accès en mon absence</span><span class="s">Le technicien peut entrer si je ne suis pas là</span></div>' + sw(ui.access, 'toggleUi', 'Accès en mon absence').replace('data-act="toggleUi"', 'data-act="toggleUi" data-arg="access"') + '</div>' +
    '<div class="row"><div class="stack"><span class="t">C’est urgent</span><span class="s">Fuite d’eau, plus de chauffage, porte bloquée…</span></div>' + sw(ui.urgent, 'toggleUi', 'C’est urgent').replace('data-act="toggleUi"', 'data-act="toggleUi" data-arg="urgent"') + '</div>' +

R['resident.suivi'] = function () {
  var all = mine();
  var r = nav.param ? reqById(nav.param) : activeMine()[0];
  if (!r) {
    var h0 = plainHdr('Appt 908', 'Mes demandes') + '<main class="body"><div class="card empty"><span class="t">Aucune demande en cours</span><span class="s">Tout fonctionne dans l’appartement. Si quelque chose casse, signalez-le ici.</span><button type="button" class="btn sm" data-go="resident.signaler">Signaler un souci</button></div>';
    return h0 + historyBlock(all, null) + '</main>';
  }
  var h = subHdr('Accueil', 'resident.accueil', esc(r.title), 'Demande n° ' + r.id + (r.log.envoyee ? ' · envoyée ' + (r.created ? 'aujourd’hui à ' + r.log.envoyee : r.log.envoyee) : ''));
  h += '<main class="body">';
  var hero = {
    nouvelle: ['Karine a reçu votre demande', 'Elle choisit le bon technicien et vous propose un créneau.'],
    assignee: ['Un technicien est assigné', PROS[r.pro || 'entretien'].name + ' · ' + slotText(r.slot)],
    enroute: ['Le technicien est en route', 'Arrivée prévue vers ' + r.eta],
    surplace: ['Le technicien est sur place', 'Arrivé à ' + r.log.surplace],
    terminee: ['Intervention terminée', r.doneLabel || ('Aujourd’hui à ' + r.log.terminee)]
  }[r.status];
  h += '<section class="banner" style="padding:18px"><span class="circ">' + ic(r.status === 'terminee' ? 'check' : 'clock', 22, 1.8) + '</span><div class="stack"><span class="t lg">' + hero[0] + '</span><span class="s" style="font-size:15px">' + esc(hero[1]) + '</span></div></section>';
  if (!r.old) {
    var reached = { nouvelle: 0, assignee: 2, enroute: 3, surplace: 4, terminee: 5 }[r.status];
    var items = [
      ['Demande envoyée', r.log.envoyee],
      ['Prise en charge par la gestion', r.log.prise || 'En attente'],
      ['Technicien assigné', r.pro ? PROS[r.pro].name + ' · ' + slotText(r.slot) : 'Karine choisit un technicien'],
      ['En route', r.log.enroute ? 'Depuis ' + r.log.enroute : ''],
      ['Sur place', r.log.surplace ? 'Depuis ' + r.log.surplace : ''],
      ['Intervention terminée', r.log.terminee ? r.log.terminee + (r.techNote ? ' · « ' + esc(r.techNote) + ' »' : '') : 'Vous serez notifié, même si vous êtes absent']
    ];
    h += '<section class="card" style="padding:18px 18px 2px" aria-label="Étapes"><ol class="tl">' + items.map(function (it, i) {
      var cur = (i === reached && (r.status === 'enroute' || r.status === 'surplace')) || (r.status === 'nouvelle' && i === 1);
      var done = i <= reached && !cur;
      var last = i === items.length - 1;
      return '<li><div class="rail"><span class="mk ' + (done ? 'done' : cur ? 'cur' : '') + '">' + (done ? ic('check', 14, 3) : '') + '</span>' + (last ? '' : '<span class="ln ' + (i < reached ? 'done' : '') + '"></span>') + '</div><div class="tx"><span class="t ' + (done || cur ? '' : 'todo') + '">' + it[0] + '</span>' + (it[1] ? '<span class="s ' + (cur ? 'cur' : '') + '">' + it[1] + '</span>' : '') + '</div></li>';
    }).join('') + '</ol></section>';
  }
  if (r.status !== 'terminee') {
    var canChange = r.status !== 'surplace';
    h += '<section class="card row">' + ic('lock', 22, 1.7) + '<div class="stack"><span class="t">' + (r.access ? 'Accès autorisé en votre absence' : 'Présence requise') + '</span><span class="s">' + (canChange ? 'Vous pouvez changer d’avis jusqu’à l’arrivée' : 'Le technicien est déjà sur place') + '</span></div>' + (canChange ? sw(r.access, 'toggleAccess', 'Accès en mon absence').replace('data-act="toggleAccess"', 'data-act="toggleAccess" data-arg="' + r.id + '"') : '') + '</section>';
  }
  h += historyBlock(all, r);
  h += '<button type="button" class="btn ghost" style="margin-top:auto" data-act="openMsg" data-arg="908">Écrire à la gestion</button></main>';
  return h;
};
function historyBlock(all, cur) {
  var others = all.filter(function (x) { return !cur || x.id !== cur.id; }).sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
  if (!others.length) return '';
  return '<section class="sec"><h2 class="h2">Autres demandes</h2><div class="card list">' + others.map(function (x) {
    return '<button type="button" class="row" data-go="resident.suivi.' + x.id + '"><div class="stack"><span class="t">' + esc(x.title) + '</span><span class="s">' + resSub(x) + '</span></div>' + resPill(x) + '</button>';
  }).join('') + '</div></section>';
}

R['resident.espaces'] = function () {
  var pr = poolRow(), gr = gymRow();
  var d = ui.loungeDay, cur = DAYS[d];
  var busy = loungeOn(d).filter(function (l) { return l.appt !== '908'; });
  var own = S.lounge.filter(function (l) { return l.day === d && l.appt === '908'; }).slice(-1)[0];
  var h = plainHdr('Mis à jour en temps réel', 'Espaces communs') + '<main class="body" style="gap:16px">';
  h += '<section class="card pad"><div class="row" style="padding:0">' + ic('pool', 24, 1.6) + '<h2 class="t lg" style="flex:1">Piscine</h2>' + pr.pill + '</div><div class="s" style="font-size:15px">' + (S.spaces.pool ? 'Tous les jours de 7 h à minuit' : 'Fermée par la gestion. Vous serez prévenu à la réouverture.') + '</div><div class="soft warn">' + ic('cal', 18) + 'Fermée jeudi 1er oct. de 8 h à 12 h (entretien)</div></section>';
  h += '<section class="card pad" style="gap:14px"><div class="row" style="padding:0">' + ic('lounge', 24, 1.6) + '<h2 class="t lg" style="flex:1">Lounge</h2>' + (loungeOn(0).length ? pill('warn', 'Privatisé ce soir', 1) : pill('ok', 'Libre ce soir', 1)) + '</div>';
  h += '<div class="days">' + DAYS.map(function (x, i) {
    var b = loungeOn(i).length, m = S.lounge.some(function (l) { return l.day === i && l.appt === '908' && l.status !== 'no'; });
    return '<button type="button" class="day" aria-pressed="' + (i === d) + '" data-act="pickDay" data-arg="' + i + '" aria-label="' + x.long + (b ? ', réservé' : ', libre') + '"><span class="dw">' + x.dow + '</span><span class="dn">' + x.num + '</span><span class="dd ' + (m ? 'mine' : b ? 'busy' : '') + '"></span></button>';
  }).join('') + '</div>';
  h += '<div class="soft plain" style="flex-direction:column;align-items:flex-start;gap:4px"><span class="t">' + cur.long + '</span><span>' + (busy.length ? busy.map(function (l) { return 'Privatisé de ' + l.range.replace('–', 'à'); }).join(', ') + ' — le reste de la journée est libre.' : 'Libre toute la journée.') + '</span></div>';
  if (own && own.status !== 'no') {
    h += '<div class="okbox">' + ic('check', 18, 2.2) + (own.status === 'ok' ? 'Réservation confirmée · ' + own.range : 'Demande envoyée à la gestion · ' + own.range) + '</div>';
  } else {
    if (own && own.status === 'no') h += '<div class="soft bad">' + ic('info', 18) + 'La gestion n’a pas pu accepter ce créneau. Essayez un autre horaire.</div>';
    h += '<div class="fld"><label for="lrange">Horaire souhaité</label><select id="lrange" data-draft="loungeRange">' + RANGES.map(function (x) { return '<option' + (x === ui.loungeRange ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>';
    h += '<button type="button" class="btn md" data-act="requestLounge">Demander une réservation</button>';
  }
  h += '<p class="xs">Les autres résidents voient le créneau pris, jamais votre nom ni votre appartement.</p></section>';
  h += '<section class="card row" style="padding:16px">' + ic('gym', 24, 1.6) + '<div class="stack"><h2 class="t lg">Salle d’entraînement</h2><span class="s" style="font-size:15px">' + (S.spaces.gym ? 'Tous les jours de 7 h à 22 h' : 'Fermée temporairement') + '</span></div>' + gr.pill + '</section></main>';
  return h;
};

    '<div class="howto">' + ic('info', 22, 1.8) + '<p><strong>Démo interactive.</strong> Les quatre vues partagent les mêmes données : une demande envoyée par le résident arrive chez Karine, puis chez le technicien, et le résident voit chaque étape. Un colis enregistré à l’accueil apparaît aussitôt chez le résident.</p></div>' +
    '<div class="ov-actions"><button type="button" class="btn md" style="width:auto" data-go="resident.accueil">Commencer par le résident</button>' + resetBtn('btn ghost md').replace('class="btn ghost md', 'style="width:auto" class="btn ghost md') + '</div></section></div>';
}

function tabsHtml() {
  var role = ROLES[nav.role];
  var active = TABOF[nav.screen] || nav.screen;
  if (nav.role === 'tech' && nav.screen === 'mission') { var c = currentMission(); active = c && c.id === nav.param ? 'encours' : 'missions'; }
  return '<nav class="tabs" aria-label="Navigation principale">' + role.tabs.map(function (t) {
    var cur = active === t[0];
    if (t[3]) return '<button type="button" class="tab fabtab" data-go="' + nav.role + '.' + t[0] + '"' + (cur ? ' aria-current="page"' : '') + ' aria-label="Signaler un souci"><span class="fab">' + ic(t[2], 22, 2.2) + '</span>' + t[1] + '</button>';
    return '<button type="button" class="tab" data-go="' + nav.role + '.' + t[0] + '"' + (cur ? ' aria-current="page"' : '') + '>' + ic(t[2], 22, 1.8) + t[1] + '</button>';
  }).join('') + '</nav>';
}
var SCREEN_NAMES = { accueil: 'Accueil', signaler: 'Signaler un souci', suivi: 'Suivi de la demande', espaces: 'Espaces communs', services: 'Services & documents', colis: 'Colis', visiteurs: 'Visiteurs', ascenseur: 'Ascenseur de service', tableau: 'Tableau de bord', demandes: 'Demandes', demande: 'Assigner une demande', missions: 'Mes missions', mission: 'Intervention', encours: 'En cours' };

function renderRole() {
  var root = document.getElementById('root');
  var key = nav.role + '.' + nav.screen + '.' + nav.param;
  var prevScroll = 0, sc = root.querySelector('.scroll');
  if (sc && key === lastKey) prevScroll = sc.scrollTop;
  var fn = R[nav.role + '.' + nav.screen] || R[nav.role + '.' + ROLES[nav.role].home];
  var screen = fn();
  key = nav.role + '.' + nav.screen + '.' + nav.param;
  var role = ROLES[nav.role];
  var steps = STEPS.map(function (s, i) {
    var d = s.done();
    return '<li><button type="button" class="step' + (d ? ' done' : '') + '" data-go="' + s.go + '"><span class="n">' + (d ? ic('check', 14, 3) : i + 1) + '</span><span class="stack"><span class="t">' + s.t + '</span><span class="s">' + s.s + '</span></span></button></li>';
  }).join('');
  root.innerHTML =
    '<div class="split"><aside class="panel"><div class="panel-top"><img src="logo-gabriel.jpg" alt="Logo Gabriel"><div class="stack"><span class="t">Le Gabriel</span><span class="s">Démo interactive de l’app</span></div></div>' +
    '<div class="panel-sec"><div class="label-gold">Voir l’app comme…</div>' + roleButtons(true) + '</div>' +
    '<div class="panel-sec"><div class="label-gold">Ce que voit ce rôle</div><ul class="sees">' + role.sees.map(function (s) { return '<li>' + ic('shield', 16, 1.8) + '<span>' + s + '</span></li>'; }).join('') + '</ul></div>' +
    '<div class="panel-sec"><div class="label-gold">Scénario à montrer</div><ol class="steps">' + steps + '</ol></div>' +
    '<div class="panel-foot"><button type="button" class="pbtn" data-go="overview">' + ic('grid', 18) + 'Vue d’ensemble · qui voit quoi</button>' + resetBtn('pbtn') + '</div></aside>' +
    '<div class="stage"><div class="mbar"><span>Démo · ' + role.label + '</span><button type="button" data-go="overview">Changer de rôle</button></div>' +
    '<div class="stage-cap">' + role.label + ' · ' + (SCREEN_NAMES[nav.screen] || '') + '</div>' +
    '<div class="phone"><div class="app" id="app"><div class="scroll">' + screen + '</div>' + tabsHtml() + sheetHtml() + '</div></div></div></div>';
  var nsc = root.querySelector('.scroll');
  if (nsc) nsc.scrollTop = key === lastKey ? prevScroll : 0;
  lastKey = key;
}

var toastTimer;
function render() {
  if (nav.view === 'overview') { renderOverview(); lastKey = ''; } else renderRole();
  save();
  if (toastMsg) {
    var host = document.getElementById('app') || document.getElementById('root');
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = ic('check', 18, 2.2) + '<span>' + esc(toastMsg) + '</span>';
    if (!document.getElementById('app')) { t.style.position = 'fixed'; t.style.left = '50%'; t.style.right = 'auto'; t.style.transform = 'translateX(-50%)'; }
    host.appendChild(t); toastMsg = null;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }
}

/* ================= Événements ================= */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-go]');
  if (!el) return;
  if (el.hasAttribute('data-act')) {
    var fn = A[el.getAttribute('data-act')];
    if (fn) { var r = fn(el.getAttribute('data-arg'), el, ev); if (r !== false) render(); }
    return;
  }
  ev.preventDefault(); go(el.getAttribute('data-go'));
});
function setDraft(el) {
  var k = el.getAttribute('data-draft'), v = el.value;
  if (k.indexOf('slot:') === 0) { ui.assign[k.slice(5)].slot = +v; return; }
  if (k.indexOf('note:') === 0) { ui.notes[k.slice(5)] = v; return; }
  ui[k] = v;
  if (k === 'rappt') { var h = document.getElementById('rappt-hint'); if (h) h.textContent = dirHint(v.trim()); }
}
document.addEventListener('input', function (ev) { var el = ev.target.closest('[data-draft]'); if (el) setDraft(el); });
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-draft]'); if (el) setDraft(el);
  if (ev.target.id === 'photo-in' && ev.target.files && ev.target.files[0]) {
    var f = ev.target.files[0], rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var sc = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { ui.photo = c.toDataURL('image/jpeg', 0.72); } catch (e) { ui.photo = rd.result; }
        render();
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });
setInterval(function () { if (nav.view === 'role' && !ui.sheet && !document.activeElement.matches('input,textarea,select')) renderRole(); }, 60000);

/* Ouverture : lien direct (#resident.accueil…) ou vue d’ensemble */
var hsh = (location.hash || '').slice(1);
if (hsh && hsh !== 'apercu' && ROLES[hsh.split('.')[0]]) go(hsh); else render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  var hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW) location.reload(); });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
