<title>App Le Gabriel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Raleway:wght@700;800&display=swap">
<style>
/* Mise en page : écran de choix du profil, puis l'app. Sur ordinateur, panneau de présentation + téléphone. Visuel volontairement sobre : fond clair, gros texte, noir pour les actions, or en touche discrète. */
:root{
  color-scheme: light;
  --night:#0E0E0D; --ink:#151412; --paper:#F6F4EF; --card:#FFFFFF; --stage:#E6E1D6;
  --line:#E3DED3; --field:#D6D0C3;
  --muted:#5E5A52; --gold:#C9A45C; --gold-text:#7F6128;
  --on-dark:#FFFFFF; --on-dark-muted:#CFC9BD; --dark-line:#3A3730;
  --ok:#22603B; --wait:#8A5A12; --bad:#9A3B2E;
  --display: Raleway, "Avenir Next", "Segoe UI", sans-serif;
  --text: Barlow, "Helvetica Neue", system-ui, sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--text);font-size:17px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,p{margin:0}
h1,h2{text-wrap:balance}
.ic{flex-shrink:0;display:block}
#root{height:100%}

/* ---------- Écran de départ ---------- */
.start{min-height:100%;background:var(--paper);display:flex;justify-content:center;padding:40px 20px calc(40px + env(safe-area-inset-bottom, 0px))}
.start-in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:24px}
.start-logo{width:96px;height:96px;border-radius:20px;object-fit:cover}
.start h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.15}
.start p.lead{font-size:18px;color:var(--muted);line-height:1.45}
.profiles{display:flex;flex-direction:column;gap:12px}
.profile{display:flex;align-items:center;gap:16px;min-height:84px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%}
.profile:hover{border-color:var(--ink)}
.profile .pic{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.profile .stack{flex:1}
.profile .t{font-size:20px;font-weight:600}
.profile .s{font-size:16px;color:var(--muted)}
details.who{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 18px}
details.who summary{min-height:60px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}
details.who summary::-webkit-details-marker{display:none}
details.who[open] summary .ic{transform:rotate(90deg)}
.tbl-wrap{overflow-x:auto;margin:0 -18px 18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{text-align:left;padding:10px 8px;vertical-align:top;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:14px;color:var(--muted);font-weight:600}
tbody th{font-weight:600}
td.none{color:#9A948A}
.linkbtn{font-size:16px;font-weight:600;color:var(--gold-text);min-height:44px;display:inline-flex;align-items:center;gap:8px}

/* ---------- Démo (ordinateur) ---------- */
.split{height:100%;display:grid;grid-template-columns:320px minmax(0,1fr)}
.panel{background:var(--night);color:var(--on-dark);padding:28px 22px;display:flex;flex-direction:column;gap:26px;overflow-y:auto}
.panel-top{display:flex;align-items:center;gap:12px}
.panel-top img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.panel-top .t{font-family:var(--display);font-weight:700;font-size:18px}
.panel-top .s{font-size:14px;color:var(--on-dark-muted)}
.plabel{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.psec{display:flex;flex-direction:column;gap:8px}
.prole{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:1px solid var(--dark-line);border-radius:12px;font-size:16px;font-weight:600;width:100%}
.prole .ic{color:var(--gold)}
.prole span.l{flex:1}
.prole[aria-current="true"]{border-color:var(--gold);background:#1c1a15}
.prole:hover{border-color:var(--gold)}
.ping{width:9px;height:9px;border-radius:999px;background:var(--gold)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:10px;font-size:15px}
.step:hover{background:#1c1a15}
.step .n{width:24px;height:24px;border-radius:999px;border:1.5px solid var(--dark-line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--on-dark-muted);flex-shrink:0}
.step.done .n{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.step.done .l{color:var(--on-dark-muted)}
.pfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.pbtn{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--dark-line);font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;width:100%}
.pbtn:hover{border-color:var(--gold)}
.pbtn.warn{border-color:var(--bad);color:#F2C6BE}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto;min-width:0}
.phone{width:390px;height:860px;max-height:100%;min-height:560px;border:10px solid var(--night);border-radius:48px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(14,14,13,.45);background:var(--paper);flex-shrink:0;display:flex;flex-direction:column}
.mbar{display:none;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px;background:var(--night);border-bottom:1px solid #22201c;color:var(--on-dark-muted);font-size:15px;flex-shrink:0}
.mbar b{color:#fff;font-weight:600}
.mbar button{color:var(--gold);font-weight:600;min-height:40px;padding:0 4px}

/* ---------- App ---------- */
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.top{display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:72px;padding:8px 20px 10px;background:var(--night);color:var(--on-dark)}
.top-title{padding:20px 20px 4px;display:flex;flex-direction:column;gap:4px}
.logo{width:60px;height:60px;object-fit:cover;display:block;margin-left:-6px}
.back{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 8px;margin-left:-8px;border-radius:999px;font-size:17px;font-weight:600}
.back{color:var(--gold)}
.back:hover{background:#1c1a15}
.bell{width:44px;height:44px;border-radius:999px;background:transparent;border:1px solid var(--dark-line);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.bdot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:999px;background:var(--gold);border:2px solid var(--night)}
.title{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15}
.subtitle{font-size:17px;color:var(--muted);line-height:1.4}
.body{flex:1;padding:18px 20px 28px;display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:18px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.card.pad{padding:18px;display:flex;flex-direction:column;gap:14px}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;width:100%}
button.row:hover{background:#FBFAF7}
.stack{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rt{font-size:17px;font-weight:600}
.rs{font-size:15px;color:var(--muted);line-height:1.35}
.num{font-family:var(--display);font-weight:700;font-size:17px;min-width:46px;font-variant-numeric:tabular-nums}
.chev{color:#A39D92}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tag::before{content:"";width:9px;height:9px;border-radius:999px;background:currentColor}
.tag.ok{color:var(--ok)} .tag.wait{color:var(--wait)} .tag.bad{color:var(--bad)} .tag.go{color:var(--ink)}
.alert{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--ink);color:#fff;width:100%}
.alert .ic{color:var(--gold)}
.alert .rs{color:var(--on-dark-muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{min-height:104px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:12px;text-align:left}
.tile .rt{font-size:18px;line-height:1.2}
.tile.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile.main .ic{color:var(--gold)}
.tile:hover{border-color:var(--ink)}
.req{display:flex;flex-direction:column;gap:14px;padding:18px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.req:hover{border-color:var(--ink)}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prog span{height:6px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--gold)}
.steplist{list-style:none;margin:0;padding:4px 18px;display:flex;flex-direction:column}
.steplist li{display:flex;gap:14px;align-items:center;min-height:58px}
.steplist li+li{border-top:1px solid var(--line)}
.mk{width:30px;height:30px;border-radius:999px;border:2px solid var(--field);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.mk.done{background:var(--ink);border-color:var(--ink)}
.mk.cur{border:9px solid var(--gold)}
.steplist .todo{color:var(--muted);font-weight:500}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{min-height:74px;padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:14px;font-weight:600;line-height:1.2}
.choice[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.choice[aria-pressed="true"] .ic{color:var(--gold)}
.choice.flat{min-height:44px;flex-direction:row;padding:6px 10px;font-size:15px}
.choice small{display:block;font-size:12px;font-weight:500;opacity:.75}
.choice.day2{flex-direction:column;gap:1px;min-height:54px}
.floors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.floors .choice.flat{min-height:40px;padding:4px}
.floors .ph{grid-column:span 5}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-h{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hour{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 12px;gap:0;text-align:left}
.hour b{font-size:15px;font-weight:600}
.hour small{font-size:13px;color:var(--ok);font-weight:600}
.hour[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hour[aria-pressed="true"] small{color:var(--gold)}
.hour:disabled{background:repeating-linear-gradient(135deg,#EEEAE1 0 6px,#E7E2D8 6px 12px);border-color:#E3DED3;color:#8B857A;cursor:not-allowed}
.hour:disabled small{color:var(--wait)}
.choice:disabled{background:#EEEAE1;color:#9A948A;text-decoration:line-through;cursor:not-allowed}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:9px 13px}
.radio{width:22px;height:22px;flex-shrink:0;border-radius:999px;border:2px solid #B5AE9F}
.opt[aria-pressed="true"] .radio{border:7px solid var(--ink)}
.switch{width:56px;height:34px;flex-shrink:0;border-radius:999px;padding:3px;display:flex;justify-content:flex-start;background:var(--field);transition:background .2s}
.switch span{width:28px;height:28px;border-radius:999px;background:#fff;display:block;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok);justify-content:flex-end}
.btn{min-height:50px;width:100%;border-radius:12px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;text-align:center}
.btn:hover{background:#2a2823}
.btn.alt{background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
.btn.alt:hover{background:#FBFAF7}
.btn.small{min-height:40px;width:auto;font-size:15px;border-radius:10px;padding:0 14px}
.btn.red{background:var(--bad)}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lbl{font-size:18px;font-weight:600}
input[type=text],textarea{font-family:var(--text);font-size:17px;padding:12px 14px;border:1.5px solid var(--field);border-radius:12px;background:var(--card);color:var(--ink);width:100%;min-height:50px}
textarea{resize:none;line-height:1.4}
input.big{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em}
.photo-add{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:1.5px dashed #B5AE9F;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;background:var(--card)}
.photo{position:relative;border-radius:14px;overflow:hidden}
.photo img{display:block;width:100%;max-height:200px;object-fit:cover}
.photo .x{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:999px;background:rgba(14,14,13,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.ph{min-height:90px;border-radius:14px;background:#EEEAE1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--muted)}
.okbox{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:#E8F1EA;color:var(--ok);font-size:17px;font-weight:600;line-height:1.35}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted);line-height:1.4}
.hint .ic{margin-top:1px}
.quote{font-size:17px;line-height:1.45}
.empty{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.empty .rs{max-width:270px}
.done-screen{flex:1;padding:36px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.done-screen .big{width:76px;height:76px;border-radius:999px;background:var(--ok);display:flex;align-items:center;justify-content:center;color:#fff}
.done-screen h2{font-family:var(--display);font-size:26px;font-weight:700}
.done-screen p{font-size:17px;color:var(--muted);line-height:1.5}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{min-height:62px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);background:var(--card)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.day .dw{font-size:12px}
.day .dn{font-size:18px;font-weight:600}
.day .dd{width:6px;height:6px;border-radius:999px}
.day .dd.busy{background:var(--wait)}
.day .dd.mine{background:var(--gold)}
.mission{display:flex;flex-direction:column;gap:10px;padding:18px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left}
.mission.now{border:2px solid var(--ink);padding:17px}
.mission .when{font-size:15px;font-weight:600;color:var(--gold-text)}
.mission .what{display:flex;align-items:baseline;gap:12px}
.mission .what b{font-family:var(--display);font-size:26px}
.mission .what span{font-size:18px;font-weight:600}
.tabs{flex-shrink:0;height:calc(72px + env(safe-area-inset-bottom, 0px));background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:0 4px env(safe-area-inset-bottom, 0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7A756C;font-size:13px;font-weight:600}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{color:var(--gold-text)}
.tdot{position:absolute;top:-2px;right:-5px;width:10px;height:10px;border-radius:999px;background:var(--gold);border:2px solid var(--card)}
.sheet-back{position:absolute;inset:0;background:rgba(14,14,13,.5);display:flex;align-items:flex-end;z-index:20;animation:fade .15s ease-out}
.sheet{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom, 0px));max-height:85%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font-family:var(--display);font-size:22px;font-weight:700}
.xbtn{width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:16px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:up .22s ease-out}
.toast .ic{color:var(--gold)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width: 859px){
  .split{display:flex;flex-direction:column;height:100%;height:100vh;height:100dvh;overflow:hidden}
  .panel{display:none}
  .mbar{display:flex;padding-top:calc(8px + env(safe-area-inset-top, 0px))}
  .stage{flex:1;min-height:0;padding:0;justify-content:stretch;align-items:stretch;overflow:hidden}
  .phone{width:100%;flex:1 1 auto;height:auto;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
  .start{padding-top:calc(28px + env(safe-area-inset-top, 0px))}
}
</style>

<div id="root"></div>

  openDoc: function (a) { ui.sheet = { type: 'doc', name: a }; },
  call: function (a) { toast('Dans l’app, ce bouton appelle ' + a + ' directement'); },
  toggleAccess: function (id) { var r = reqById(id); r.access = !r.access; ping('gestion'); if (r.pro === 'entretien') ping('tech'); toast(r.access ? 'Le technicien pourra entrer' : 'Votre présence sera demandée'); },
  pickDay: function (a) { ui.loungeDay = +a; },
  pickRange: function (a) { ui.loungeRange = a; },
  requestLounge: function () { S.lounge.push({ id: 'L' + Date.now(), day: ui.loungeDay, range: ui.loungeRange, appt: '908', note: 'Demande depuis l’app', status: 'pending' }); ping('gestion'); toast('Demande envoyée à Karine'); },
  togglePref: function (a) { S.prefs[a] = !S.prefs[a]; },
  pickVday: function (a) { ui.vday = a; },
  pickVtime: function (a) { ui.vtime = a; },
  setUp: function (a) { ui.vup = a === '1'; },
  sendVisitor: function () {
    if (!ui.vname.trim()) { toast('Écrivez le nom du visiteur'); return; }
    S.visitors.push({ id: 'v' + Date.now(), appt: '908', name: ui.vname.trim(), kind: 'visiteur', day: ui.vday, time: ui.vtime, up: ui.vup, arrived: false });
    ui.vsent = true; ping('accueil'); toast('L’accueil est prévenu');
  },
  newVisitor: function () { ui.vsent = false; ui.vname = ''; },
  pickReason: function (a) { ui.reason = a; },
  pickSlot: function (a) { ui.eslot = +a; },
  sendElevator: function () { S.elevator.push({ id: 'E' + Date.now(), slot: ui.eslot, appt: '908', reason: ui.reason, status: 'pending' }); ping('gestion'); toast('Demande envoyée à Karine'); },
  togglePool: function () { S.spaces.pool = !S.spaces.pool; notifyRes(S.spaces.pool ? 'La piscine est rouverte' : 'La piscine est fermée', S.spaces.pool ? 'Ouverte de 7 h à minuit' : 'Fermée pour le moment'); ping('accueil'); toast(S.spaces.pool ? 'Piscine ouverte · résidents prévenus' : 'Piscine fermée · résidents prévenus'); },
  toggleGym: function () { S.spaces.gym = !S.spaces.gym; notifyRes(S.spaces.gym ? 'La salle de sport est rouverte' : 'La salle de sport est fermée', S.spaces.gym ? 'Ouverte de 7 h à 22 h' : 'Fermée pour le moment'); toast(S.spaces.gym ? 'Salle ouverte · résidents prévenus' : 'Salle fermée · résidents prévenus'); },
  pickPro: function (a) { var p = a.split(':'); ui.assign[p[0]].pro = p[1]; ui.assign[p[0]].start = null; },
  pickGDay: function (a) { var p = a.split(':'), x = ui.assign[p[0]]; x.day = p[1]; x.start = null; x.tbd = false; },
  pickDur: function (a) { var p = a.split(':'), x = ui.assign[p[0]]; x.dur = +p[1]; x.start = null; },
  pickHour: function (a) { var p = a.split(':'), x = ui.assign[p[0]]; x.start = +p[1]; x.tbd = false; },
  pickTbd: function (id) { var x = ui.assign[id]; x.tbd = !x.tbd; x.start = null; },
  assign: function (id) {
    var r = reqById(id), a = ui.assign[id];
    if (!a.tbd && a.start == null) { toast('Choisissez un horaire libre dans l’agenda'); return; }
    r.pro = a.pro; r.slot = a.tbd ? { day: 'tbd', time: '' } : mkSlot(a.day, a.start, a.dur); r.status = 'assignee'; r.log.prise = fmt(now());
    if (r.appt === '908') notifyRes('Un technicien est prévu', r.title + ' · ' + slotText(r.slot));
    if (r.pro === 'entretien') ping('tech');
    ping('accueil'); toast('Technicien envoyé · le ' + r.appt + ' est prévenu');
  },
  unassign: function (id) { var r = reqById(id); ui.assign[id] = { pro: r.pro, day: r.slot && r.slot.day !== 'tbd' ? r.slot.day : 'today', start: null, dur: (r.slot && r.slot.dur) || 1, tbd: false }; r.status = 'nouvelle'; delete r.pro; delete r.slot; delete r.log.prise; },
  gDone: function (id) { var r = reqById(id); r.status = 'terminee'; r.log.terminee = fmt(now()); if (r.appt === '908') notifyRes('C’est réparé', r.title); toast('Réparation confirmée · le ' + r.appt + ' est prévenu'); },
  extArrive: function (id) { var r = reqById(id); r.status = 'surplace'; r.log.surplace = fmt(now()); if (r.appt === '908') notifyRes('Le technicien est arrivé', r.title); ping('gestion'); toast('Karine voit que ' + PROS[r.pro].name + ' est arrivé'); },
  extLeft: function (id) { var r = reqById(id); r.log.parti = fmt(now()); ping('gestion'); toast('Karine voit que le technicien est reparti'); },
  toggleFloor: function (a) { var f = a === 'PH' ? 'PH' : +a, i = ui.floors.indexOf(f); if (i > -1) ui.floors.splice(i, 1); else ui.floors.push(f); },
  decide: function (a) {
    var p = a.split(':'), list = p[0] === 'L' ? S.lounge : S.elevator;
    var x = list.filter(function (i) { return i.id === p[1]; })[0];
    x.status = p[2]; x.decided = p[2] !== 'pending';
    if (x.appt === '908' && x.decided) notifyRes((p[0] === 'L' ? 'Lounge' : 'Ascenseur') + ' : ' + (x.status === 'ok' ? 'réservation acceptée' : 'demande refusée'), p[0] === 'L' ? DAYS[x.day].short + ', ' + x.range : 'Vendredi, ' + ESLOTS[x.slot]);
    if (x.decided) toast((x.status === 'ok' ? 'Acceptée' : 'Refusée') + ' · le ' + x.appt + ' est prévenu');
  },
  pickAud: function (a) { ui.aud = a; },
  postAnn: function () {
    if (!ui.annText.trim()) { toast('Écrivez d’abord l’annonce'); return; }
    if (ui.aud === 'floors' && !ui.floors.length) { toast('Choisissez au moins un étage'); return; }
    var body = ui.aud === 'unit' ? 'Pour l’appartement ' + ui.annUnit : ui.aud === 'floors' ? floorsLabel(ui.floors) : AUD.all;
    var ann = { id: 'a' + Date.now(), when: 'à l’instant', title: ui.annText.trim(), body: body, aud: ui.aud, unit: ui.annUnit, floors: ui.floors.slice(), isNew: true };
    S.announcements.unshift(ann);
    ui.annPosted = true;
    if (seesAnn(ann)) notifyRes('Nouvelle annonce', ui.annText.trim());
    ping('accueil'); toast('Annonce publiée');
  },
  newAnn: function () { ui.annPosted = false; ui.annText = ''; },
  advance: function (id) {
    var r = reqById(id), t = fmt(now());
    if (r.status === 'assignee') {
      r.status = 'enroute'; r.log.enroute = t; r.eta = fmt(now() + 20);
      if (r.slot.day !== 'today') r.slot = mkSlot('today', Math.floor(now() / 60), 1);
      if (r.appt === '908') notifyRes('Le technicien est en route', r.title + ' · il arrive vers ' + r.eta);
      toast('Le résident sait que vous arrivez');
    } else if (r.status === 'enroute') {
      r.status = 'surplace'; r.log.surplace = t;
      if (r.appt === '908') notifyRes('Le technicien est arrivé', r.title);
      toast('Le résident sait que vous êtes là');
    } else if (r.status === 'surplace') {
      r.status = 'terminee'; r.log.terminee = t; r.techNote = (ui.notes[id] || '').trim();
      if (r.appt === '908') notifyRes('C’est réparé', r.title + (r.techNote ? ' · « ' + r.techNote + ' »' : ''));
      toast('Terminé · résident et Karine prévenus');
    }
    ping('gestion');
  },
  saveParcel: function () {
    var a = (ui.rappt || '').trim();
    if (!DIR[a]) { toast('Numéro d’appartement inconnu'); return; }
    S.parcels.push({ id: 'p' + Date.now(), appt: a, when: 'Aujourd’hui ' + fmt(now()), time: fmt(now()), given: false, isNew: true });
    if (a === '908') notifyRes('Un colis vous attend à l’accueil', 'À récupérer quand vous voulez, 24 h/24');
    ui.rsaved = 'Enregistré. Le ' + a + ' est prévenu' + (a !== '908' || S.prefs.sms ? ' (notification et SMS).' : ' (notification).');
    toast('Colis enregistré');
  },
  newParcel: function () { ui.rsaved = null; ui.rappt = ''; },
  giveParcel: function (id) {
    var p = S.parcels.filter(function (x) { return x.id === id; })[0];
    p.given = true; p.givenLabel = 'Récupéré aujourd’hui à ' + fmt(now());
    if (p.appt === '908') ping('resident');
    toast('Colis remis au ' + p.appt);
  },
  arrive: function (id) {
    var v = S.visitors.filter(function (x) { return x.id === id; })[0]; v.arrived = true;
    if (v.appt === '908') notifyRes(v.name + ' est arrivé', v.up ? 'Il monte' : 'L’accueil vous appelle');
    toast('Le ' + v.appt + ' est prévenu');
  },
  reset: function () {
    if (!ui.resetArm) { ui.resetArm = true; setTimeout(function () { if (ui.resetArm) { ui.resetArm = false; render(); } }, 3500); return; }
    S = seed(); ui = freshUi(); save(); toast('La démo est remise à zéro');
  }
};

/* ================= Navigation & rendu ================= */
var lastKey = '';
function go(t) {
  ui.sheet = null;
  if (t === 'start') nav.view = 'start';
  else {
    var p = t.split('.');
    nav.view = 'role'; nav.role = p[0]; nav.screen = p[1] || ROLES[p[0]].home; nav.param = p[2] || '';
    delete S.unseen[nav.role];
  }
  try { history.replaceState(null, '', '#' + (nav.view === 'start' ? 'depart' : nav.role + '.' + nav.screen + (nav.param ? '.' + nav.param : ''))); } catch (e) { }
  render();
}

var STEPS = [
  ['Le résident signale un problème', 'resident.signaler', function () { return S.requests.some(function (r) { return r.isNew; }); }],
  ['Karine envoie un technicien', 'gestion.tableau', function () { return S.requests.some(function (r) { return r.isNew && r.status !== 'nouvelle'; }); }],
  ['Le technicien répare', 'tech.missions', function () { return S.requests.some(function (r) { return r.isNew && r.status === 'terminee'; }); }],
  ['Le résident suit tout en direct', 'resident.demandes', function () { return false; }],
  ['L’accueil enregistre un colis', 'accueil.colis', function () { return S.parcels.some(function (p) { return p.isNew; }); }],
  ['Karine ferme la piscine', 'gestion.tableau', function () { return !S.spaces.pool; }]
];
function resetBtn(cls) { return '<button type="button" class="' + cls + (ui.resetArm ? ' warn' : '') + '" data-act="reset">' + ic('reset', 20) + (ui.resetArm ? 'Toucher encore pour confirmer' : 'Remettre la démo à zéro') + '</button>'; }

function renderStart() {
  var rows = [
    ['Demandes de réparation', 'Les siennes', 'Toutes', '—', 'Les siennes'],
    ['Coordonnées des résidents', '—', 'Oui', 'Le nom', '—'],
    ['Colis', 'Les siens', '—', 'Tous', '—'],
    ['Visiteurs', 'Les siens', '—', 'Ceux du jour', '—'],
    ['Qui a réservé le lounge', '—', 'Oui', '—', '—'],
    ['Annonces', 'Lire', 'Publier', 'Lire', '—']
  ];
  document.getElementById('root').innerHTML =
    '<div class="start"><div class="start-in"><img class="start-logo" src="logo-gabriel.jpg" alt="Logo Gabriel, appartements de luxe"><div style="display:flex;flex-direction:column;gap:8px"><h1>L’app du Gabriel</h1><p class="lead">Réparations, espaces communs, colis et visiteurs, au même endroit. Choisissez un profil pour essayer.</p></div>' +
    '<div class="profiles">' + Object.keys(ROLES).map(function (k) {
      var r = ROLES[k];
      return '<button type="button" class="profile" data-go="' + k + '.' + r.home + '"><span class="pic">' + ic(r.icon, 26, 1.7) + '</span><span class="stack"><span class="t">' + r.label + '</span><span class="s">' + r.sub + '</span></span><span class="chev">' + ic('chevR', 22, 2) + '</span></button>';
    }).join('') + '</div>' +
    '<details class="who"><summary>Qui voit quoi ?' + ic('chevR', 20, 2) + '</summary><div class="tbl-wrap"><table><thead><tr><th scope="col"></th><th scope="col">Résident</th><th scope="col">Gestion</th><th scope="col">Accueil</th><th scope="col">Technicien</th></tr></thead><tbody>' +
    rows.map(function (r) { return '<tr><th scope="row">' + r[0] + '</th>' + r.slice(1).map(function (c) { return '<td' + (c === '—' ? ' class="none"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></details>' +
    '<div>' + resetBtn('linkbtn') + '</div></div></div>';
}

function tabsHtml() {
  var role = ROLES[nav.role];
  if (!role.tabs.length) return '';
  var active = (nav.role === 'resident' || nav.role === 'gestion') && TABOF[nav.screen] ? TABOF[nav.screen] : nav.screen;
  return '<nav class="tabs" aria-label="Navigation principale">' + role.tabs.map(function (t) {
    var dot = t[0] === 'messages' && S.messages.some(function (m) { return !m.read; });
    return '<button type="button" class="tab" data-go="' + nav.role + '.' + t[0] + '"' + (active === t[0] ? ' aria-current="page"' : '') + '><span style="position:relative">' + ic(t[2], 26, 1.8) + (dot ? '<span class="tdot" aria-label="Non lu"></span>' : '') + '</span>' + t[1] + '</button>';
  }).join('') + '</nav>';
}

function renderRole() {
  var root = document.getElementById('root');
  var key = nav.role + '.' + nav.screen + '.' + nav.param;
  var sc = root.querySelector('.scroll'), prev = sc && key === lastKey ? sc.scrollTop : 0;
  var fn = R[nav.role + '.' + nav.screen] || R[nav.role + '.' + ROLES[nav.role].home];
  var role = ROLES[nav.role];
  var screen = fn();
  root.innerHTML =
    '<div class="split"><aside class="panel"><div class="panel-top"><img src="logo-gabriel.jpg" alt="Logo Gabriel"><div class="stack"><span class="t">Le Gabriel</span><span class="s">Démo de l’app</span></div></div>' +
    '<div class="psec"><div class="plabel">Profil</div>' + Object.keys(ROLES).map(function (k) {
      var cur = nav.role === k;
      return '<button type="button" class="prole" aria-current="' + cur + '" data-go="' + k + '.' + ROLES[k].home + '">' + ic(ROLES[k].icon, 22, 1.7) + '<span class="l">' + ROLES[k].label + '</span>' + (S.unseen[k] && !cur ? '<span class="ping" aria-label="Nouveautés"></span>' : '') + '</button>';
    }).join('') + '</div>' +
    '<div class="psec"><div class="plabel">À montrer</div><ol class="steps">' + STEPS.map(function (s, i) {
      var d = s[2]();
      return '<li><button type="button" class="step' + (d ? ' done' : '') + '" data-go="' + s[1] + '"><span class="n">' + (d ? ic('check', 14, 3) : i + 1) + '</span><span class="l">' + s[0] + '</span></button></li>';
    }).join('') + '</ol></div>' +
    '<div class="pfoot"><button type="button" class="pbtn" data-go="start">' + ic('grid', 20) + 'Écran de départ</button>' + resetBtn('pbtn') + '</div></aside>' +
    '<div class="stage"><div class="phone"><div class="mbar"><span>Profil : <b>' + role.label + '</b></span><button type="button" data-go="start">Changer</button></div>' +
    '<div class="app" id="app"><div class="scroll">' + screen + '</div>' + tabsHtml() + sheetHtml() + '</div></div></div></div>';
  var nsc = root.querySelector('.scroll');
  if (nsc) nsc.scrollTop = prev;
  lastKey = key;
}

var toastTimer;
function render() {
  if (nav.view === 'start') { renderStart(); lastKey = ''; } else renderRole();
  save();
  if (toastMsg) {
    var app = document.getElementById('app');
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
    t.innerHTML = ic('check', 20, 2.4) + '<span>' + esc(toastMsg) + '</span>';
    if (!app) { t.style.position = 'fixed'; t.style.maxWidth = '480px'; t.style.margin = '0 auto'; t.style.bottom = '24px'; }
    (app || document.body).appendChild(t); toastMsg = null;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
  }
}

/* ================= Événements ================= */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-go]');
  if (!el || el.disabled) return;
  if (el.hasAttribute('data-act')) {
    var fn = A[el.getAttribute('data-act')];
    if (fn && fn(el.getAttribute('data-arg'), el, ev) !== false) render();
    return;
  }
  ev.preventDefault(); go(el.getAttribute('data-go'));
});
function setDraft(el) {
  var k = el.getAttribute('data-draft'), v = el.value;
  if (k.indexOf('note:') === 0) { ui.notes[k.slice(5)] = v; return; }
  ui[k] = v;
  if (k === 'rappt') { var h = document.getElementById('rappt-hint'); if (h) h.textContent = dirHint(v.trim()); }
}
document.addEventListener('input', function (ev) { var el = ev.target.closest('[data-draft]'); if (el) setDraft(el); });
document.addEventListener('change', function (ev) {
  if (ev.target.id !== 'photo-in' || !ev.target.files || !ev.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { ui.photo = c.toDataURL('image/jpeg', 0.72); } catch (e) { ui.photo = rd.result; }
      render();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(ev.target.files[0]);
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });
setInterval(function () { if (nav.view === 'role' && !ui.sheet && !document.activeElement.matches('input,textarea')) renderRole(); }, 60000);

var hsh = (location.hash || '').slice(1);
if (hsh && ROLES[hsh.split('.')[0]]) go(hsh); else render();
})();
</script>
